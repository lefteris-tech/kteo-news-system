name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile all Python files
        run: |
          set -e
          echo "Compiling backend/*.py and backend/pages/*.py..."
          python -m py_compile backend/*.py
          python -m py_compile backend/pages/*.py
          echo "All files compile cleanly."

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: ./backend
          additional_files: |
            backend/run_cron.sh
            backend/fetch_raw_cron.sh
