# /etc/nginx/sites-available/curate
# Sprint 4 — Autovision News Curator reverse proxy
# Proxies curate.dronepros.gr → Streamlit on 127.0.0.1:8501
# WebSocket upgrade headers are essential — Streamlit uses WS for state sync.

server {
    listen 80;
    listen [::]:80;
    server_name curate.dronepros.gr;

    # Reasonable upload size (manual injection image URLs only — small)
    client_max_body_size 4M;

    # Main reverse proxy
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — required for Streamlit reactivity
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeouts for WebSocket idle connections
        proxy_read_timeout  86400;
        proxy_send_timeout  86400;
        proxy_connect_timeout 60;

        # Buffering off so SSE / streamed responses flush promptly
        proxy_buffering off;
    }

    # Streamlit's specific WebSocket endpoint (catches bidirectional traffic)
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;

        proxy_set_header Host       $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Streamlit health probe (used by monitoring + Cloudflare Access bypass list)
    location = /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        access_log off;
    }
}
